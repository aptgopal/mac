name: lodge_booking_client
description: Hotel/Lodge booking client app (Android + Web).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  provider: ^6.1.2
  intl: ^0.20.3
  google_fonts: ^6.2.1
  razorpay_flutter: ^1.3.0
  lottie: ^1.4.2
  sizer: ^2.0.15
  page_transition: ^2.0.9
  cached_network_image: ^3.3.1
  flutter_rating_bar: ^4.0.1
  percent_indicator: ^4.2.2
  map_launcher: ^3.0.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3
  smooth_page_indicator: ^1.0.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/lottie/
    - assets/lang/
